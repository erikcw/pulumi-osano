version: 2

project_name: pulumi-osano

builds:
  - id: build-provider
    dir: provider
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore: []
    main: ./cmd/pulumi-resource-osano/
    # -trimpath and a fixed modification time make the binaries reproducible, so a release archive
    # can be rebuilt and compared with its provenance attestation.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s
      - -w
      # {{ .Version }} is the tag without its leading "v", the same string `make provider` stamps, so the
      # plugin reports one version everywhere (GetPluginInfo, the User-Agent, and the release name).
      - -X github.com/jflavan/pulumi-osano/provider/version.Version={{ .Version }}
    binary: pulumi-resource-osano

archives:
  - name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    id: archive

snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT"

# Generate checksums for all artifacts
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Generate Software Bill of Materials (SBOM) for supply chain security
# Users can scan these for vulnerabilities using tools like grype
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# Auto-generate changelog from git commits
# Groups commits by type based on conventional commit prefixes
changelog:
  disable: false
  use: github
  sort: asc
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "📚 Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "🧹 Maintenance"
      regexp: '^.*?(chore|refactor|test|ci)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^Merge"

release:
  disable: false
  prerelease: auto
  # Include SBOM info in release notes
  footer: |
    ## Security

    Each release artifact includes an SBOM (Software Bill of Materials) file
    (`.sbom.json`) that lists all dependencies. You can scan these for
    vulnerabilities using tools like [grype](https://github.com/anchore/grype):

    ```bash
    grype sbom:./pulumi-resource-osano-{{ .Tag }}-linux-amd64.tar.gz.sbom.json
    ```

    ### SLSA Provenance Attestations

    Binary releases include SLSA provenance attestations generated by GitHub Actions. Verify
    the build provenance of downloaded artifacts using the GitHub CLI:

    ```bash
    gh attestation verify pulumi-resource-osano-{{ .Tag }}-linux-amd64.tar.gz \
      --owner jflavan
    ```
