name: command-dispatch

# A maintainer comments `/run-acceptance-tests` on a pull request to run run-acceptance-tests.yml
# against its head commit with the repository's secrets, which a fork pull request's own runs never
# get. Review the pull request first: the dispatched run executes its Makefile and tests.
on:
  issue_comment:
    types:
      - created

jobs:
  command-dispatch-for-testing:
    name: command-dispatch-for-testing
    runs-on: ubuntu-latest
    permissions:
      # Creating a repository_dispatch event needs the contents write scope.
      contents: write
      pull-requests: write
    steps:
      - uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a # v5
        with:
          commands: |
            run-acceptance-tests
          issue-type: pull-request
          permission: write
          reaction-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
