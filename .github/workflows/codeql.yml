# CodeQL code scanning (advanced setup). Maintainer notes: CONTRIBUTING.md, "Code Scanning (CodeQL)".
# - Keep code scanning "default setup" disabled in the repository settings; enabling it turns this workflow off.
# - Keep this file name, the `analyze` job id, the matrix languages and the categories stable. Renaming any of
#   them orphans existing alerts, and PR results show "configuration not found" until main is re-analyzed and
#   the old configuration is deleted (Security and quality > Code scanning > Tool status).
# - init and analyze must stay on the same github/codeql-action commit. Bump them together.
# - The `main` branch ruleset requires the "CodeQL gate" job and GitHub's "CodeQL" results check, and
#   requires pull request branches to be up to date with main. Keep the gate job's name stable, or update
#   the ruleset in the same change.
name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 5 * * 1" # weekly, Mondays 05:27 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  # Cancel superseded runs of the same pull request only. Push, schedule and manual runs each get a
  # unique group (their run id), so an analysis of main is never cancelled or replaced while pending.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout and the PR diff lookup
      security-events: write # upload results (accepted from fork pull requests too)
    env:
      # Analyze the whole codebase on pull requests too. Diff-informed analysis only computes alerts on
      # changed lines, so a PR that deletes a guard or a permissions block could add an alert elsewhere
      # that no check sees. The new-alert step compares these full results with the base branch.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
      # sdk/java has no Gradle wrapper, so the Java extractor would fetch the newest Gradle and report
      # "Required Gradle version not specified" under Tool status. This undocumented autobuilder variable
      # pins the version it fetches; keep it in step with aqua:gradle/gradle-distributions in .config/mise.toml.
      # If CodeQL drops the variable, only that warning returns.
      LGTM_INDEX_GRADLE_VERSION: ${{ matrix.language == 'java-kotlin' && '7.6.6' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions # .github/workflows/*.yml and .github/actions/*/action.yml
            build-mode: none
          - language: go # provider, tests/e2e helpers, sdk/go/osano, examples/quickstart/go
            build-mode: autobuild # runs `make` (the first Makefile target), then extracts every Go module
          - language: javascript-typescript # sdk/nodejs and the TypeScript examples
            build-mode: none
          - language: python # scripts/, sdk/python and the Python example
            build-mode: none
          - language: csharp # the C# example, tests/dotnet and sdk/dotnet, analyzed without a build
            build-mode: none
          - language: java-kotlin # sdk/java, analyzed without a build
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and both parents, for the new-alert check's local fallback

      # Must run before init. Installs the go.mod toolchain (go1.27.1) and exports GOTOOLCHAIN=local,
      # so no nested go.mod may require a newer Go than the root go.mod toolchain line. A module that
      # does is skipped with only a Tool status warning, and Analyze (go) stays green.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Default queries plus the medium-precision security queries; no code-quality queries.
          # If a config-file is ever added, move the suite into it: this input overrides a config file's queries.
          queries: security-extended

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

      # analyze never fails because of findings. On pull requests, fail this job when the pull request
      # introduces an alert of any severity that has no open or dismissed counterpart on the base branch.
      - name: Fail on new CodeQL alerts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: /language:${{ matrix.language }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          BASE_REF: refs/heads/${{ github.base_ref }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: bash .github/scripts/fail-on-new-codeql-alerts.sh

  # The single check to require for merging: it fails if any language's analysis failed, was cancelled,
  # or found new alerts. `always()` makes it run and fail (not skip) when analyze did not succeed. Only
  # pull_request runs, which run the new-alert step, report the exact required name "CodeQL gate".
  gate:
    name: ${{ github.event_name == 'pull_request' && 'CodeQL gate' || format('CodeQL gate ({0})', github.event_name) }}
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CodeQL analysis to pass
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          echo "CodeQL analysis result: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "::error::A CodeQL analysis failed, was cancelled, or found new alerts. See the Analyze jobs."
            exit 1
          fi
