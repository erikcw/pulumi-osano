name: run-acceptance-tests
on:
  repository_dispatch:
    types:
      - run-acceptance-tests-command
  pull_request:
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PROVIDER: osano
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PYTHONVERSION: "3.11.8"
  JAVAVERSION: "11"
  PR_COMMIT_SHA: ${{ github.event.client_payload.pull_request.head.sha }}

jobs:
  comment-notification:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    name: comment-notification
    permissions:
      pull-requests: write # To comment on the PR that ran the command.
    steps:
      - name: Create URL to the run output
        id: vars
        run: echo "run-url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Update with Result
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          issue-number: ${{ github.event.client_payload.github.payload.issue.number }}
          body: "Please view the PR build: ${{ steps.vars.outputs.run-url }}"

  prerequisites:
    runs-on: ubuntu-latest
    name: prerequisites
    permissions:
      id-token: write # For ESC secrets.
      pull-requests: write # For schema check comment.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ env.PR_COMMIT_SHA || github.ref }}

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          cache: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'pull_request'
        name: Install Schema Tools
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: pulumi/schema-tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build codegen binaries
        run: make codegen

      - name: Build Schema
        run: make generate_schema

      - if: github.event_name == 'pull_request'
        name: Check Schema is Valid
        shell: bash
        run: |
          set +e
          schema-tools compare -r github://api.github.com/${{ github.repository_owner }} -p ${{ env.PROVIDER }} -o ${{ github.event.repository.default_branch }} -n --local-path=provider/cmd/pulumi-resource-${{ env.PROVIDER }}/schema.json 2>&1 | tee schema-check.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "SCHEMA_CHANGES<<EOF" >> "$GITHUB_ENV"
          cat schema-check.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          exit $status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        name: Comment on PR with Details of Schema Check
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ${{ env.SCHEMA_CHANGES }}
          comment-tag: schemaCheck
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Provider
        run: make provider

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@0d90c81496aa8d6a31d9c6a0d6297feea2f54057 # v2.0.0
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar provider binaries
        run: tar -zcf ${{ github.workspace }}/bin/provider.tar.gz -C ${{ github.workspace }}/bin/ pulumi-resource-${{ env.PROVIDER }} pulumi-gen-${{ env.PROVIDER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulumi-${{ env.PROVIDER }}-provider.tar.gz
          path: ${{ github.workspace }}/bin/provider.tar.gz

      - name: Test Provider Library
        run: make test_provider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build_sdks:
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        language:
          - nodejs
          - python
          - dotnet
          - go
          - java
    name: build_sdks
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ env.PR_COMMIT_SHA || github.ref }}

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Provider Binary
        uses: ./.github/actions/download-provider

      - name: Generate SDK
        run: make generate_${{ matrix.language }}

      - name: Build SDK
        run: make build_${{ matrix.language }}

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@0d90c81496aa8d6a31d9c6a0d6297feea2f54057 # v2.0.0
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar SDK folder
        run: tar -zcf sdk/${{ matrix.language }}.tar.gz -C sdk/${{ matrix.language }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/${{ matrix.language }}.tar.gz
          retention-days: 30

  build_examples:
    needs: prerequisites
    runs-on: ubuntu-latest
    name: build_examples
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ env.PR_COMMIT_SHA || github.ref }}

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Provider Binary
        uses: ./.github/actions/download-provider

      - name: Compile e2e suites
        run: make test_e2e_compile

      - name: Test build scripts
        run: make test_scripts

      - name: Build examples
        run: make build_examples

  acceptance_reads:
    needs: prerequisites
    runs-on: ubuntu-latest
    name: acceptance_reads
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ env.PR_COMMIT_SHA || github.ref }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check acceptance configuration
        id: acceptance-config
        shell: bash
        env:
          OSANO_UC_API_KEY: ${{ secrets.OSANO_UC_API_KEY }}
          OSANO_TEST_SUBJECT_REF: ${{ secrets.OSANO_TEST_SUBJECT_REF }}
          OSANO_TEST_CONFIG_ID: ${{ secrets.OSANO_TEST_CONFIG_ID }}
          OSANO_TEST_HASHED_SUBJECT_ID: ${{ secrets.OSANO_TEST_HASHED_SUBJECT_ID }}
          OSANO_TEST_COLLECTION_ID: ${{ secrets.OSANO_TEST_COLLECTION_ID }}
        run: |
          missing=()
          for var in \
            OSANO_UC_API_KEY \
            OSANO_TEST_SUBJECT_REF \
            OSANO_TEST_CONFIG_ID \
            OSANO_TEST_HASHED_SUBJECT_ID \
            OSANO_TEST_COLLECTION_ID
          do
            if [[ -z "${!var}" ]]; then
              missing+=("$var")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping acceptance reads; missing secrets: ${missing[*]}"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run acceptance read suite
        if: steps.acceptance-config.outputs.available == 'true'
        env:
          OSANO_RUN_CONSENT_E2E: "1"
          OSANO_UC_API_KEY: ${{ secrets.OSANO_UC_API_KEY }}
          OSANO_API_BASE_URL: ${{ secrets.OSANO_API_BASE_URL }}
          OSANO_TEST_SUBJECT_REF: ${{ secrets.OSANO_TEST_SUBJECT_REF }}
          OSANO_TEST_REFERENCE_TYPE: ${{ secrets.OSANO_TEST_REFERENCE_TYPE }}
          OSANO_TEST_CONFIG_ID: ${{ secrets.OSANO_TEST_CONFIG_ID }}
          OSANO_TEST_HASHED_SUBJECT_ID: ${{ secrets.OSANO_TEST_HASHED_SUBJECT_ID }}
          OSANO_TEST_COLLECTION_ID: ${{ secrets.OSANO_TEST_COLLECTION_ID }}
          OSANO_TEST_COLLECTIONS_JURISDICTION: ${{ secrets.OSANO_TEST_COLLECTIONS_JURISDICTION }}
          OSANO_TEST_COLLECTIONS_TYPE: ${{ secrets.OSANO_TEST_COLLECTIONS_TYPE }}
        run: go test ./tests/e2e -run "TestUnifiedConsentLookups|TestConfigAndCollectionsReads" -tags "e2e consentread"

  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ env.PR_COMMIT_SHA || github.ref }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Disarm go:embed directives to enable linters
        run: git grep -l 'go:embed' -- provider | xargs --no-run-if-empty sed -i 's/go:embed/ goembed/g'

      - name: golangci-lint provider pkg
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: .
          install-mode: none

  # Drives the provider through real Pulumi engine operations against an in-process mock of the Osano
  # Customer REST API, so it needs no secrets. The suite builds and installs the provider plugin itself.
  pipeline_e2e:
    runs-on: ubuntu-latest
    name: pipeline_e2e
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ env.PR_COMMIT_SHA || github.ref }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pipeline e2e suite
        env:
          OSANO_RUN_PIPELINE_E2E: "1"
        run: go test -tags 'e2e pipeline' -count=1 -timeout 20m -v ./tests/e2e/pipeline/...

  sentinel:
    runs-on: ubuntu-latest
    name: sentinel
    needs:
      - build_sdks
      - build_examples
      - prerequisites
      - lint
      - pipeline_e2e
    steps:
      - name: Mark workflow as successful
        uses: guibranco/github-status-action-v2@77639353504055053524efa7a3719aaf0b731ce9 # v1.2.4
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: Sentinel
          state: success
          description: Sentinel checks passed
          sha: ${{ env.PR_COMMIT_SHA || github.event.pull_request.head.sha || github.sha }}
    permissions:
      statuses: write
