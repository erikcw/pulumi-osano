name: build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - CHANGELOG.md
    tags-ignore:
      - v*
      - sdk/*
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PROVIDER: osano
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PYTHONVERSION: "3.11.8"
  JAVAVERSION: "11"

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    name: prerequisites
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          cache: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build codegen binaries
        run: make codegen

      - name: Build Schema
        run: make generate_schema

      - name: Build Provider
        run: make provider

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@0d90c81496aa8d6a31d9c6a0d6297feea2f54057 # v2.0.0
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar provider binaries
        run: tar -zcf ${{ github.workspace }}/bin/provider.tar.gz -C ${{ github.workspace }}/bin/ pulumi-resource-${{ env.PROVIDER }} pulumi-gen-${{ env.PROVIDER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulumi-${{ env.PROVIDER }}-provider.tar.gz
          path: ${{ github.workspace }}/bin/provider.tar.gz

      - name: Test Provider Library
        run: make test_provider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build_sdks:
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        language:
          - nodejs
          - python
          - dotnet
          - go
          - java
    name: build_sdks
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Provider Binary
        uses: ./.github/actions/download-provider

      - name: Generate SDK
        run: make generate_${{ matrix.language }}

      - name: Build SDK
        run: make build_${{ matrix.language }}

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@0d90c81496aa8d6a31d9c6a0d6297feea2f54057 # v2.0.0
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar SDK folder
        run: tar -zcf sdk/${{ matrix.language }}.tar.gz -C sdk/${{ matrix.language }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/${{ matrix.language }}.tar.gz
          retention-days: 30

  build_examples:
    needs: prerequisites
    runs-on: ubuntu-latest
    name: build_examples
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Provider Binary
        uses: ./.github/actions/download-provider

      - name: Compile e2e suites
        run: make test_e2e_compile

      - name: Test build scripts
        run: make test_scripts

      - name: Build examples
        run: make build_examples

  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Disarm go:embed directives to enable linters
        run: git grep -l 'go:embed' -- provider | xargs --no-run-if-empty sed -i 's/go:embed/ goembed/g'

      - name: golangci-lint provider pkg
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: .
          install-mode: none
