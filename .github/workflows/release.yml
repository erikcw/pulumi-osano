name: release

# Two modes (see docs/RELEASE_GUIDE.md):
# - Pushing a vX.Y.Z tag publishes a release: GitHub release binaries, npm, PyPI, NuGet, Maven Central
#   and the Go SDK tag.
# - A manual run (Actions > release > Run workflow) is always a dry run. It builds and tests the
#   provider and every SDK exactly like a release, runs GoReleaser in snapshot mode and runs read-only
#   registry checks, but publishes nothing. There is no input that turns a manual run into a release.
# Every job that publishes runs only for a tag push, and only those jobs get write or id-token
# permissions, so a dry run never holds a token that could publish.
# Re-running a partially failed release: use "Re-run failed jobs". npm and Maven Central skip a version
# that is already published, PyPI (skip-existing) and NuGet (--skip-duplicate) skip it too, and
# pulumi/publish-go-sdk-action skips pushing a Go SDK tag that already exists. Right after a publish the
# npm and Maven Central lookups can miss the new version; see docs/RELEASE_GUIDE.md before re-running.
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch: {}

# Jobs that publish declare their own, broader permissions.
permissions:
  contents: read

env:
  PROVIDER: osano
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PYTHONVERSION: "3.11.8"
  JAVAVERSION: "11"

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    name: prerequisites
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      # A tag push uses the tag's version. A manual run from the default branch gets the next minor
      # version as an alpha, e.g. 0.2.0-alpha.1790300000 while v0.1.0 is the latest release; from
      # another branch it also appends the short commit hash, e.g. 0.2.0-alpha.1790300000+abc1234.
      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          cache: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build codegen binaries
        run: make codegen

      - name: Build Schema
        run: make generate_schema

      - name: Build Provider
        run: make provider

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@0d90c81496aa8d6a31d9c6a0d6297feea2f54057 # v2.0.0
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar provider binaries
        run: tar -zcf "$GITHUB_WORKSPACE/bin/provider.tar.gz" -C "$GITHUB_WORKSPACE/bin/" "pulumi-resource-$PROVIDER"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulumi-${{ env.PROVIDER }}-provider.tar.gz
          path: ${{ github.workspace }}/bin/provider.tar.gz

      - name: Test Provider Library
        run: make test_provider

  build_sdks:
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        language:
          - nodejs
          - python
          - dotnet
          - go
          - java
    name: build_sdks
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Provider Binary
        uses: ./.github/actions/download-provider

      - name: Generate SDK
        run: make "generate_$LANGUAGE"

      - name: Build SDK
        run: make "build_$LANGUAGE"

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@0d90c81496aa8d6a31d9c6a0d6297feea2f54057 # v2.0.0
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar SDK folder
        run: tar -zcf "sdk/$LANGUAGE.tar.gz" -C "sdk/$LANGUAGE" .

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/${{ matrix.language }}.tar.gz

  # Everything the pull request checks run, so a tag never publishes what `main` would not merge.
  verify:
    needs: prerequisites
    runs-on: ubuntu-latest
    name: verify
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: golangci-lint provider pkg
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: .
          install-mode: none

      - name: Compile e2e suites
        run: make test_e2e_compile

      - name: Test build scripts
        run: make test_scripts

      - name: Run pipeline e2e suite
        run: make test_pipeline_e2e

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build_sdks, verify]
    name: publish
    permissions:
      contents: write
      id-token: write        # Required for SLSA provenance attestation
      attestations: write    # Required for actions/attest-build-provenance
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -p 3 release --clean --timeout 60m0s
          version: "~> v2"

      # subject-checksums attests every file listed in checksums.txt (each archive and its SBOM) by
      # its own digest, so `gh attestation verify <archive>.tar.gz` finds the archive's provenance.
      # subject-path would attest only checksums.txt itself.
      - name: Generate SLSA Provenance for Go Binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: 'dist/checksums.txt'

  # Dry-run counterpart of `publish`: builds the same release archives without creating a GitHub
  # release, uploading assets or attesting provenance.
  publish_dry_run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build_sdks, verify]
    name: publish (dry run)
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # --snapshot skips publishing, announcing and git validation, so no GitHub release is created.
      # GORELEASER_CURRENT_TAG gives the archives the same names a release of this version would have.
      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
        with:
          args: -p 3 release --snapshot --clean --timeout 60m0s
          version: "~> v2"

      # `pulumi plugin install resource osano <version> --server github://...` downloads
      # pulumi-resource-osano-v<version>-<os>-<arch>.tar.gz from the release, so check those names.
      - name: Check release archive names
        run: |
          missing=0
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              archive="dist/pulumi-resource-$PROVIDER-v$PROVIDER_VERSION-$os-$arch.tar.gz"
              if [[ -f "$archive" ]]; then
                echo "found $archive"
              else
                echo "::error::GoReleaser did not produce $archive"
                missing=1
              fi
            done
          done
          test -f dist/checksums.txt || { echo "::error::GoReleaser did not produce dist/checksums.txt"; missing=1; }
          exit "$missing"

      - name: Upload dry-run archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-provider-archives
          path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish_sdks:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publish
    name: publish_sdks
    permissions:
      id-token: write  # Required for npm and PyPI Trusted Publishing, NuGet OIDC login, npm provenance and attestations
      contents: write  # gh release upload of the attested NuGet package
      attestations: write  # Required for actions/attest-build-provenance on the NuGet package
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download python SDK
        uses: ./.github/actions/download-sdk
        with:
          language: python

      - name: Download dotnet SDK
        uses: ./.github/actions/download-sdk
        with:
          language: dotnet

      - name: Download nodejs SDK
        uses: ./.github/actions/download-sdk
        with:
          language: nodejs

      # Publish the Node.js SDK to npm (see .github/scripts/publish-npm.sh).
      # - Trusted publishing (OIDC): the trusted publisher on npmjs.com uses the exact, case-sensitive
      #   values Owner: jflavan, Repository: pulumi-osano, Workflow: release.yml. Needs npm 11.5.1+,
      #   Node 22.14.0+ and id-token: write (set above). See https://docs.npmjs.com/trusted-publishers/
      # - NPM_TOKEN: not set and not needed. v0.1.0 was bootstrapped by hand without a token, and the
      #   trusted publisher has been active since. The secret is still exposed as NODE_AUTH_TOKEN for the
      #   .npmrc that setup-node writes, which npm reads only when the OIDC exchange fails. An empty or
      #   missing NPM_TOKEN does not affect trusted publishing. See docs/RELEASE_GUIDE.md.
      - name: Setup Node for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Publish Node.js SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash .github/scripts/publish-npm.sh sdk/nodejs/bin

      # Publish Python SDK to PyPI using Trusted Publishing (OIDC)
      # No API token needed - uses GitHub's OIDC identity
      # Automatically generates Sigstore attestations
      # See: https://docs.pypi.org/trusted-publishers/
      - name: Publish Python SDK
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/bin/dist/
          skip-existing: true  # Don't fail if version exists

      # Publish .NET SDK to NuGet using Trusted Publishing (OIDC)
      # No long-lived API key needed - uses GitHub's OIDC identity
      # See: https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: NuGet Login (OIDC)
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Publish .NET SDK
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          mapfile -t packages < <(find sdk/dotnet -maxdepth 5 -name '*.nupkg' -print)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::expected exactly one .nupkg under sdk/dotnet, found ${#packages[@]}: ${packages[*]}"
            exit 1
          fi
          dotnet nuget push "${packages[0]}" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # nuget.org records no build provenance and re-signs every package it receives, so the copy it
      # serves has a different digest from the file pushed above. Attest the pushed file and attach it
      # to the GitHub release, where `gh attestation verify <package>.nupkg --owner jflavan` verifies it
      # as it does the plugin archives.
      - name: Attest the NuGet package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk/dotnet/bin/Release/*.nupkg
      - name: Attach the attested NuGet package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sdk/dotnet/bin/Release/*.nupkg --clobber

  # Dry-run counterpart of `publish_sdks`: read-only registry checks, no credentials.
  publish_sdks_dry_run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: publish_dry_run
    name: publish_sdks (dry run)
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download python SDK
        uses: ./.github/actions/download-sdk
        with:
          language: python

      - name: Download dotnet SDK
        uses: ./.github/actions/download-sdk
        with:
          language: dotnet

      - name: Download nodejs SDK
        uses: ./.github/actions/download-sdk
        with:
          language: nodejs

      - name: Setup Node for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      # Same script and npm version as the release, with --dry-run. The empty NODE_AUTH_TOKEN replaces
      # setup-node's placeholder token so the read-only registry lookups run anonymously.
      - name: Check Node.js SDK publish (dry run)
        env:
          NODE_AUTH_TOKEN: ""
        run: bash .github/scripts/publish-npm.sh --dry-run sdk/nodejs/bin

      # pypa/gh-action-pypi-publish v1.14.2 runs `twine check` (twine 7.0.0) before uploading; run the
      # same check.
      - name: Check Python SDK distributions (dry run)
        run: |
          python_version=$(pulumictl convert-version --language python --version "$PROVIDER_VERSION")
          bash .github/scripts/registry-has-version.sh pypi pulumi-osano "$python_version"
          ls -l sdk/python/bin/dist/
          python3 -m venv "$RUNNER_TEMP/twine"
          "$RUNNER_TEMP/twine/bin/python" -m pip install --quiet "twine==7.0.0"
          "$RUNNER_TEMP/twine/bin/twine" check sdk/python/bin/dist/*

      - name: Check .NET SDK package (dry run)
        run: |
          mapfile -t packages < <(find sdk/dotnet -maxdepth 5 -name '*.nupkg' -print)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::expected exactly one .nupkg under sdk/dotnet, found ${#packages[@]}: ${packages[*]}"
            exit 1
          fi
          echo "would push ${packages[0]}"
          unzip -l "${packages[0]}"
          bash .github/scripts/registry-has-version.sh nuget Community.Pulumi.Osano "$PROVIDER_VERSION"

      # pulumi/publish-go-sdk-action skips copying, committing and pushing when the tag already exists.
      - name: Check Go SDK tag (dry run)
        run: |
          tag="sdk/go/osano/v$PROVIDER_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::Go SDK tag $tag already exists; a release would not push it again."
          else
            echo "A release would push Go SDK tag $tag."
          fi

  publish_java_sdk:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publish
    name: publish_java_sdk
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download java SDK
        uses: ./.github/actions/download-sdk
        with:
          language: java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "7.6"

      # The coordinates come from the generated sdk/java/build.gradle (group from the schema's
      # java.basePackage, artifactId from scripts/patch-java-build-gradle.py).
      - name: Check Maven Central for this version
        id: maven
        run: bash .github/scripts/registry-has-version.sh maven io.github.jflavan.pulumi:pulumi-osano "$PROVIDER_VERSION"

      # Publish to Maven Central using gradle-nexus-publish-plugin v2.0.0
      # Tasks must be in same invocation: publishToSonatype followed by closeAndReleaseSonatypeStagingRepository
      # See: https://github.com/gradle-nexus/publish-plugin
      - name: Publish Java SDK
        if: steps.maven.outputs.published != 'true'
        run: gradle -p sdk/java publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          PACKAGE_VERSION: ${{ env.PROVIDER_VERSION }}
          SIGNING_KEY_ID: ${{ secrets.JAVA_SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.JAVA_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.JAVA_SIGNING_PASSWORD }}
          # Maven Central Portal credentials (token-based auth)
          PUBLISH_REPO_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # Dry-run counterpart of `publish_java_sdk`: builds the Maven publication into the runner's local
  # Maven repository (~/.m2) instead of uploading it. No credentials, no signing.
  publish_java_sdk_dry_run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: publish_dry_run
    name: publish_java_sdk (dry run)
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download java SDK
        uses: ./.github/actions/download-sdk
        with:
          language: java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "7.6"

      - name: Check Maven Central for this version
        run: bash .github/scripts/registry-has-version.sh maven io.github.jflavan.pulumi:pulumi-osano "$PROVIDER_VERSION"

      - name: Build the Maven publication (dry run)
        run: |
          gradle -p sdk/java publishToMavenLocal
          ls -l "$HOME/.m2/repository/io/github/jflavan/pulumi/pulumi-osano/$PROVIDER_VERSION/"
        env:
          PACKAGE_VERSION: ${{ env.PROVIDER_VERSION }}

  publish_go_sdk:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publish_sdks
    name: publish_go_sdk
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@c4f719182e607d0d8322f148f168d3372838e681 # v2.0.0
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download go SDK
        uses: ./.github/actions/download-sdk
        with:
          language: go

      # Pushes the sdk/go/osano/vX.Y.Z tag. Re-runs are safe: when the tag already exists the action
      # skips the copy, commit and push steps and only refreshes the Go module cache.
      - name: Publish Go SDK
        uses: pulumi/publish-go-sdk-action@0a153fa3c54227a3c0f7c97a57033ecfe94ab3c2 # v1.2.0
        with:
          repository: ${{ github.repository }}
          base-ref: ${{ github.sha }}
          source: sdk/go/osano
          path: sdk/go/osano
          version: ${{ steps.version.outputs.version }}
          additive: false
          files: "**"
