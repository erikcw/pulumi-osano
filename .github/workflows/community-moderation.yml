jobs:
  warn_codegen:
    name: warn_codegen
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: schema_changed
      name: Check for diff in schema
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: "changed: 'provider/cmd/**/schema.json'"
    - id: sdk_changed
      if: steps.schema_changed.outputs.changed == 'false'
      name: Check for diff in sdk/**
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: "changed: 'sdk/**'"
    - if: steps.sdk_changed.outputs.changed == 'true' &&
        github.event.pull_request.head.repo.full_name != github.repository
      name: Send codegen warning as comment on PR
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        comment-tag: codegen-warning
        message: >
          Hello and thank you for your pull request! :heart: :sparkles:

          It looks like you're directly modifying files in the language SDKs, which are generated.

          Make the change under `provider/` instead and run `make codegen`, which regenerates the
          schema and every SDK; see the
          [contributing guide](https://github.com/jflavan/pulumi-osano/blob/main/CONTRIBUTING.md#editing-provider-code).
name: warn-codegen
on:
  pull_request_target:
    branches:
    - main
    types:
    - opened
# pull_request_target runs with a write token, so grant only what the filters and the comment need.
permissions:
  contents: read
  pull-requests: write
