name: pull-request
on:
  pull_request_target:
    types:
      - opened

# pull_request_target runs with a write token, so grant only what commenting needs and never check out PR code.
permissions:
  pull-requests: write

jobs:
  comment-on-pr:
    runs-on: ubuntu-latest
    name: comment-on-pr
    steps:
    - name: Comment PR
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      with:
        message: >
          Thanks for the pull request. Fork pull requests run the build, lint, unit tests, and the
          mock-backed pipeline suite without secrets.

          **Note for the maintainer:** to run the live acceptance reads against Osano, review the
          changes and then comment */run-acceptance-tests* on the PR.
        comment-tag: acceptance-tests-wait
        github-token: ${{ secrets.GITHUB_TOKEN }}
    if: github.event.pull_request.head.repo.full_name != github.repository
