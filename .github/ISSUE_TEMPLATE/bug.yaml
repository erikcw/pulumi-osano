name: Bug Report
description: Report something that's not working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! This provider is community maintained and is not supported by Pulumi or Osano.
        To report a security vulnerability, do not open an issue; see [SECURITY.md](https://github.com/jflavan/pulumi-osano/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: Describe what happened
      description: Please summarize what happened, including what Pulumi commands you ran, as well as
        an inline snippet of any relevant error or console output.
    validations:
      required: true
  - type: textarea
    id: sample-program
    attributes:
      label: Sample program
      description: |
        <details><summary>Provide a reproducible sample program</summary>
        If this is a bug you encountered while running a Pulumi command, please provide us with a minimal, 
        self-contained Pulumi program that reproduces this behavior so that we can investigate on our end. 
        Without a functional reproduction, we will not be able to prioritize this bug.
        **Note:** If the program output is more than a few lines, please send us a Gist or a link to a file.
        </details>
    validations:
      required: true
  - type: textarea
    id: log-output
    attributes:
      label: Log output
      description: |
        <details><summary>How to Submit Logs</summary>
        If the problem depends on your environment, attach the output of
        `pulumi up --logtostderr --logflow -v=9 2> pulumi-debug.log` from the root of your project.
        Verbose logs can contain API keys, subject identifiers, and verification codes: redact them before posting.
        See [Logging](https://github.com/jflavan/pulumi-osano/blob/main/docs/logging.md).
        **Note:** If the log output is more than a few lines, please send us a Gist or a link to a file.
        </details>
  - type: textarea
    id: resources
    attributes:
      label: Affected Resource(s)
      description: Please list the affected Pulumi Resource(s) or Function(s).
    validations:
      required: false
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options:
        - Node.js (@jflavan/pulumi-osano)
        - Python (pulumi-osano)
        - .NET (Community.Pulumi.Osano)
        - Go (github.com/jflavan/pulumi-osano/sdk/go/osano)
        - Java (io.github.jflavan.pulumi:pulumi-osano)
        - Other or none
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Provider and SDK version
      placeholder: 0.3.0
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Output of `pulumi about`
      description: Provide the output of `pulumi about` from the root of your project.
    validations:
      required: true
  - type: textarea
    id: ctx
    attributes:
      label: Additional context
      description: Anything else you would like to add?
    validations:
      required: false
  - type: textarea
    id: voting
    attributes:
      label: Contributing
      value: |
        Vote on this issue by adding a 👍 reaction. 
        To contribute a fix for this issue, leave a comment (and link to your pull request, if you've opened one already).